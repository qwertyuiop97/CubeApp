name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        id: xcode
        run: |
          if ls /Applications/Xcode_26*.app 2>/dev/null | head -1 | grep -q Xcode; then
            dev="$(ls -d /Applications/Xcode_26*.app/Contents/Developer | head -1)"
            sudo xcode-select -s "$dev"
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✓ Xcode 26 found: $dev"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️  Xcode 26 / macOS 26 SDK not available on this runner."
            echo "    This project requires macOS 26 SDK (GlassEffect, etc)."
            echo "    Build skipped — run swift build locally to verify."
          fi

      - name: Build
        if: steps.xcode.outputs.available == 'true'
        run: swift build 2>&1

      - name: Report warnings
        if: steps.xcode.outputs.available == 'true'
        run: |
          count=$(swift build 2>&1 | grep -c ": warning:" || true)
          [ "$count" -gt 0 ] && echo "⚠️  $count warning(s)" || echo "✓ No warnings"
        continue-on-error: true

      - name: Test
        if: steps.xcode.outputs.available == 'true'
        run: swift test 2>&1
