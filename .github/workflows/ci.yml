name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          brew install gitleaks
          gitleaks git . --redact

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          for dev in /Applications/Xcode_26*.app/Contents/Developer; do
            if [[ -d "$dev" ]]; then
              sudo xcode-select -s "$dev"
              xcodebuild -version
              xcrun --sdk macosx --show-sdk-path
              exit 0
            fi
          done
          printf '%s\n' '::error::Xcode 26 is required. Refusing to report success without building and testing.'
          exit 1

      - name: Build (warnings are errors)
        run: make build

      - name: Test (warnings are errors)
        run: make test
