name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build 2>&1

      - name: Report warnings
        run: |
          output=$(swift build 2>&1)
          count=$(echo "$output" | grep -c ": warning:" || true)
          if [ "$count" -gt 0 ]; then
            echo "⚠️  $count warning(s) found — fix these in Phase 11A:"
            echo "$output" | grep ": warning:" || true
          else
            echo "✓ No warnings"
          fi
        continue-on-error: true

      - name: Test
        run: swift test 2>&1
